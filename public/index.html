<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora ATR - Mercados</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold tracking-tight text-emerald-400 mb-2">Panel de Volatilidad ATR</h1>
            <p class="text-slate-400 text-sm">Cálculo automático en tiempo real vía Python y Vercel</p>
        </header>

        <div id="loading" class="text-center py-12 text-slate-400 animate-pulse">
            Consultando precios y calculando ATR para los 22 activos... (Puede tardar unos segundos)
        </div>

        <div id="tabla-container" class="hidden overflow-x-auto rounded-xl border border-slate-800 bg-slate-900 shadow-xl">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-slate-800 bg-slate-800/50 text-slate-300 text-sm">
                        <th class="p-4">Activo</th>
                        <th class="p-4">Precio Actual</th>
                        <th class="p-4">ATR (15m)</th>
                    </tr>
                </thead>
                <tbody id="resultados-body" class="divide-y divide-slate-800/60 text-sm"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function cargarDatos() {
            try {
                const response = await fetch('/api/atr');
                const data = await response.json();
                
                const tbody = document.getElementById('resultados-body');
                tbody.innerHTML = '';
                
                data.forEach(item => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-800/30 transition-colors';
                    row.innerHTML = `
                        <td class="p-4 font-medium text-white">${item.activo}</td>
                        <td class="p-4 text-slate-300">${item.precio}</td>
                        <td class="p-4 font-semibold text-emerald-400">${item.atr}</td>
                    `;
                    tbody.appendChild(row);
                });

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('tabla-container').classList.remove('hidden');
            } catch (error) {
                document.getElementById('loading').innerText = 'Error al cargar los datos del servidor.';
            }
        }
        cargarDatos();
    </script>
</body>
</html>
